name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentos
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=agentos psql -h localhost -U agentos -d agentos -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Verify app imports cleanly
        run: |
          cd backend
          python3 -c "from app.main import app; print('App imports successfully')"
        env:
          DATABASE_URL: postgresql+asyncpg://agentos:agentos@localhost:5432/agentos
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run test suite
        run: |
          cd backend
          python3 -m pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://agentos:agentos@localhost:5432/agentos
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REDIS_URL: ""

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend test suite
        run: |
          cd frontend
          npm test
